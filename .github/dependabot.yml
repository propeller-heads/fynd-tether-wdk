version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Major upgrades (TypeScript, vitest, @types/node beyond Node 22, WDK 2.0) are done by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      wdk:
        patterns: ["@tetherto/*"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["@tetherto/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
